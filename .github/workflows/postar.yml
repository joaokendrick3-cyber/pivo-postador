name: postar
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: postar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Publicar o que já está na hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python postar.py
      - name: Guardar o que foi postado
        run: |
          git config user.name "robo-pivo"
          git config user.email "robo@pivo.local"
          git add postados.json || true
          git diff --cached --quiet || (git commit -m "postados" && git pull --rebase && git push)
